name: Evaluation documentation checks

on:
  pull_request:
    paths:
      - "docs/EVALUATIEOPDRACHT.md"
      - "docs/evals/**"
      - ".github/workflows/eval-docs-checks.yml"
  push:
    branches: [main]
    paths:
      - "docs/EVALUATIEOPDRACHT.md"
      - "docs/evals/**"
      - ".github/workflows/eval-docs-checks.yml"

permissions:
  contents: read

jobs:
  generated-documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check generated documentation is current
        run: python3 docs/evals/build.py --check
      - name: Test documentation generator
        run: python3 -m unittest discover -s docs/evals -p 'test_*.py'
