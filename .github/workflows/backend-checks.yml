name: Backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.94.1 fmt --all --check
      - name: Lints
        run: cargo +1.94.1 clippy --locked --all-targets -- -D warnings
      - name: Deterministic tests (no embedding model download)
        run: cargo +1.94.1 test --locked
      - name: Resource guard policy (no model or system probes)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build
        run: cargo +1.94.1 build --locked
