openapi: 3.0.3
info:
  title: Texas Legal Document Similarity Finder
  version: 1.2.0
  description: |
    Canonical API contract for the Rust backend. End-to-end verification status
    is documented in README and CODEBASE_GUIDE; examples remain synthetic.
    Accept a document and/or query and return exactly three unique cases.
    Scores identify the highest-ranked cases under the documented method
    within the complete indexed corpus, not guaranteed legal relevance.
    Example fixtures are synthetic and do not describe actual court opinions.
servers:
  - url: http://127.0.0.1:8000
    description: Default local backend
  - url: http://127.0.0.1:18000
    description: Optional Orq explanation adapter using the same local search backend
paths:
  /api/search:
    post:
      operationId: searchCases
      summary: Find the three highest-scoring unique cases
      description: |
        Supports document-only, query-only and combined input. At least one
        usable input is required. Trim query whitespace; a blank query counts
        as absent. An explicitly supplied invalid document always fails,
        including when a usable query is supplied. Never silently ignore it.
        Choose opinion_chunks (default, majority opinions) or head_matter
        (editorial context). All passages in the selected source section are
        scored; each case uses its maximum passage
        score. Sort by score descending, then case_id lexicographically ascending.
        For equal passage scores choose passage_id lexicographically ascending.
        The complete 135-case index must be ready; partial results are forbidden.
        The optional Orq adapter on port 18000 adds explanation_status and, only
        when all three explanations validate, explanation on each result. The
        model invokes search_cases with the original input fixed by the server;
        result identities, order, scores and source versions remain unchanged.
        Provider/schema failures preserve the real search results with status
        unavailable and omit explanations. No synthetic fallback is permitted.
        Operational limits: query text is at most 1 MiB of UTF-8 bytes (400),
        the complete multipart request is at most 12 MiB (413), and extracted
        PDF text is at most 20 MiB (422). Inputs are rejected, never truncated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                document:
                  type: string
                  format: binary
                  description: |
                    Optional PDF with extractable text or UTF-8 TXT.
                    Maximum file size 10 MiB (10485760 bytes).
                    Extracted PDF text is limited to 20 MiB (20971520 UTF-8 bytes).
                    File type must be validated by the server.
                query:
                  type: string
                  description: Optional UTF-8 query; at most 1 MiB (1048576 bytes) before trimming. Whitespace-only counts as absent.
                retrieval_method:
                  $ref: '#/components/schemas/RetrievalMethod'
              anyOf:
                - required: [document]
                - required: [query]
            encoding:
              document:
                contentType: application/pdf, text/plain
      responses:
        '200':
          description: Exactly three unique cases, ordered by the fixed ranking method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                syntheticQuery:
                  summary: Synthetic frontend fixture; scores are invented
                  externalValue: ./examples/search-response.json
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/DocumentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedDocument'
        '422':
          $ref: '#/components/responses/UnreadableDocument'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/evals/search:
    post:
      operationId: evaluateSearchCases
      summary: Run local retrieval with explicit benchmark source exclusions
      description: |
        Rust backend only; the optional Orq explanation adapter does not expose
        this route. Reuses the same loaded index, model and serialized engine as
        product search. Exclude case IDs before scoring and top-three selection.
        The eligible corpus must contain at least three cases. Unknown or
        duplicate IDs are invalid input. No judge, model generation or legal
        quality metrics are invoked. CORS and request/document/query limits
        match /api/search. This local diagnostic endpoint returns the exact
        index manifest for reproducible comparisons; it does not modify data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: Same UTF-8 query and limit as product search.
                document:
                  type: string
                  format: binary
                  description: Same PDF/TXT input and limits as product search.
                retrieval_method:
                  $ref: '#/components/schemas/RetrievalMethod'
                excluded_case_ids:
                  type: string
                  default: '[]'
                  description: JSON-encoded array of unique known case-ID strings.
              anyOf:
                - required: [document]
                - required: [query]
      responses:
        '200':
          description: Three eligible cases with exclusions and index lineage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/DocumentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedDocument'
        '422':
          $ref: '#/components/responses/UnreadableDocument'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/cases/{case_id}:
    get:
      operationId: getCase
      summary: Retrieve the full canonical text of a case
      description: |
        Returns the exact canonical text used by passage offsets. Compare
        text_version and corpus_version with the search result before marking.
        If versions differ, rerun the search instead of applying stale offsets.
        Local mock fixtures are in examples/cases.json, an array from which
        a mock selects one object by case_id. This endpoint returns one object.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Full canonical majority-opinion text and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/health:
    get:
      operationId: getHealth
      summary: Check complete search-index readiness
      description: |
        Return 200 only when the entire agreed corpus and its index are usable.
        A partial, corrupt or unavailable index returns 503.
      responses:
        '200':
          description: Complete corpus and index are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ready
                corpus_version: fixture-corpus-v1
                indexed_case_count: 135
        '503':
          $ref: '#/components/responses/IndexUnavailable'
  /openapi.json:
    get:
      operationId: getOpenApi
      summary: Retrieve the runtime OpenAPI contract
      description: Runtime JSON representation of this canonical YAML contract.
      responses:
        '200':
          description: OpenAPI 3 document.
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    RetrievalMethod:
      type: string
      enum: [opinion_chunks, head_matter]
      default: opinion_chunks
      description: |
        Select the indexed source section. Both use the same local BGE model,
        exhaustive cosine scoring, maximum passage score per case and top three.
        Head matter is editorial context, not the court's majority reasoning.
    EvaluationSearchResponse:
      type: object
      additionalProperties: false
      required: [response, excluded_case_ids, eligible_case_count, index_manifest]
      properties:
        response:
          $ref: '#/components/schemas/SearchResponse'
        excluded_case_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        eligible_case_count:
          type: integer
          minimum: 3
        index_manifest:
          type: object
          required: [format_version, pipeline, embedding, corpus_version]
          description: Exact persisted corpus, preprocessing and embedding configuration.
          properties:
            format_version:
              type: integer
              enum: [3]
            pipeline:
              type: string
            embedding:
              type: object
            corpus_version:
              type: string
    CaseMetadata:
      type: object
      required: [case_id, title, court, decision_date, citation, text_version]
      properties:
        case_id:
          type: string
          minLength: 1
          description: Stable opaque source case identifier, serialized as a string.
        title:
          type: string
        court:
          type: string
        decision_date:
          type: string
          format: date
        citation:
          type: string
          description: Citation as supplied by the corpus; never invented.
        text_version:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SHA-256 of the UTF-8 encoding of the exact canonical case text.
    Passage:
      type: object
      additionalProperties: false
      required: [passage_id, text, start_utf16, end_utf16]
      properties:
        passage_id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
          description: Exact substring of the canonical detail source selected by source_section.
        source_section:
          type: string
          enum: [majority, head_matter]
          description: |
            Additive field. Absent in legacy opinion fixtures means majority.
            New index results always supply the section. head_matter offsets
            refer to CaseDetail.head_matter, never to CaseDetail.text.
        text_version:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: |
            Additive version of this passage's source section. New results
            always supply it. Compare majority with CaseDetail.text_version
            and head matter with CaseDetail.head_matter_text_version.
        start_utf16:
          type: integer
          minimum: 0
          description: Zero-based UTF-16 code-unit position, inclusive.
        end_utf16:
          type: integer
          minimum: 1
          description: |
            UTF-16 code-unit position, exclusive and greater than start_utf16.
            Slice the selected detail source string in JavaScript to obtain
            passage.text. Offsets must not split a surrogate pair. Do not
            normalize the source string.
    Explanation:
      type: object
      additionalProperties: false
      required: [text, citations, limitations]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1200
        citations:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [passage_id, quote]
            properties:
              passage_id:
                type: string
                minLength: 1
              quote:
                type: string
                minLength: 1
                description: Exact trusted passage text supplied by the server, never a generated quote.
        limitations:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 500
    SearchResult:
      allOf:
        - $ref: '#/components/schemas/CaseMetadata'
        - type: object
          required: [score, passage, case_url]
          properties:
            explanation:
              $ref: '#/components/schemas/Explanation'
            score:
              type: number
              format: double
              minimum: -1
              maximum: 1
              description: |
                Cosine similarity for query/document mode; combined mode uses
                0.7 * query_score + 0.3 * document_score. Not a probability.
                Return the actual unrounded ranking score; display may round it.
            passage:
              $ref: '#/components/schemas/Passage'
            case_url:
              type: string
              description: Relative API path /api/cases/{case_id}, using URL encoding.
    SearchResponse:
      type: object
      additionalProperties: false
      required: [mode, corpus_version, ranking_version, results]
      properties:
        retrieval_method:
          $ref: '#/components/schemas/RetrievalMethod'
        explanation_status:
          type: string
          enum: [available, unavailable]
          description: Optional adapter status; available means all three explanations passed source validation.
        mode:
          type: string
          enum: [document, query, combined]
        corpus_version:
          type: string
          minLength: 1
          description: Identifies the complete corpus and its indexing configuration.
        ranking_version:
          type: string
          enum: [cosine-max-v1]
        results:
          type: array
          minItems: 3
          maxItems: 3
          description: Unique by case_id; ordered by score, then case_id for ties.
          items:
            $ref: '#/components/schemas/SearchResult'
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseMetadata'
        - type: object
          required: [corpus_version, text]
          properties:
            corpus_version:
              type: string
              minLength: 1
            text:
              type: string
              minLength: 1
              description: |
                Complete canonical majority-opinion text, as plain text.
                Majority-passage offsets refer to this exact string and text_version.
                No original PDF layout or HTML rendering is implied.
            head_matter:
              type: string
              description: Additive canonical editorial context; head_matter passage offsets refer here.
            head_matter_text_version:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
              description: Additive SHA-256 version of the exact canonical head_matter string.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, corpus_version, indexed_case_count]
      properties:
        status:
          type: string
          enum: [ready]
        corpus_version:
          type: string
          minLength: 1
        indexed_case_count:
          type: integer
          enum: [135]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - document_too_large
                - unsupported_document
                - unreadable_document
                - case_not_found
                - index_unavailable
                - internal_error
            message:
              type: string
              minLength: 1
              description: Human-readable explanation, without secrets or internal traces.
  responses:
    InvalidInput:
      description: No usable document or query was supplied, multipart input is malformed, or query text exceeds 1 MiB of UTF-8 bytes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_input
              message: Supply a PDF/TXT document, a query, or both.
    DocumentTooLarge:
      description: The uploaded file exceeds 10 MiB (10485760 bytes), or the complete multipart request exceeds 12 MiB (12582912 bytes). Both use document_too_large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: document_too_large
              message: The document must not exceed 10 MiB.
    UnsupportedDocument:
      description: Unsupported file type; only PDF and UTF-8 TXT are accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unsupported_document
              message: Upload a PDF or TXT document.
    UnreadableDocument:
      description: The supplied document cannot yield usable text, including corrupt/encrypted PDFs, empty files, scans or PDF extraction exceeding 20 MiB of text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unreadable_document
              message: The document contains no readable text. Scans require OCR, which is not supported.
    CaseNotFound:
      description: The requested case does not exist in this corpus.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: case_not_found
              message: Case not found.
    IndexUnavailable:
      description: The complete agreed corpus and index are not available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: index_unavailable
              message: The complete search index is not ready. Try again later.
    InternalError:
      description: Unexpected internal failure; do not expose stack traces or sensitive details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: The request could not be completed.
