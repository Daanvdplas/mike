[package]
name = "texas-case-finder"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
fastembed = { version = "=7.1.2", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
pdf-extract = "0.12.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
